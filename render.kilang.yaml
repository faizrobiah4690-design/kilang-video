services:
  - type: web
    name: kilang-pemasaran-video
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.kilang
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-3.8-flash
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: USEAPI_TOKEN
        sync: false
