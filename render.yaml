services:
  - type: web
    name: kilang-pemasaran-video
    runtime: docker
    dockerfilePath: ./Dockerfile.kilang
    healthCheckPath: /_stcore/health
    autoDeploy: false
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
